# Build from this folder:   EZDES_DATA_DIR=/path/to/workbooks docker compose up -d --build
# To use the published image instead, see zima-compose.yml.
services:
  ezdes:
    build: .
    container_name: ezdes
    ports:
      - "8765:8765"
    volumes:
      - ${EZDES_DATA_DIR:-./sample-data}:/data:ro
    restart: unless-stopped
