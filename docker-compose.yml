services:
  ezdes:
    build: .
    image: ezdes-living-local:test
    pull_policy: never
    container_name: ezdes-living-local
    ports:
      - "127.0.0.1:8777:8765"
    volumes:
      - ${EZDES_DATA_DIR:-./data}:/data:ro
      - ${EZDES_STATE_DIR:-./state}:/state
    environment:
      EZDES_OPEN_BROWSER: "0"
      EZDES_STATE_DIR: "/state"
      EZDES_DATA_DIR: "/data"
      EZDES_PASSWORD: "${EZDES_PASSWORD:?Set an EZDES_PASSWORD before starting the container}"
    restart: unless-stopped
